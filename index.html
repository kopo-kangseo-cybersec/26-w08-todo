<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7fb">
    <title>To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body class="min-h-screen bg-slate-100 px-4 py-8 text-slate-800 sm:py-12">
    <main class="mx-auto w-full max-w-3xl">
      <section class="overflow-hidden rounded-3xl bg-white shadow-xl shadow-slate-200/70">
        <header class="bg-gradient-to-br from-indigo-600 to-violet-600 px-6 py-8 text-white sm:px-10 sm:py-10">
          <p class="mb-2 text-sm font-semibold uppercase tracking-[0.2em] text-indigo-100">오늘의 할 일</p>
          <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">To-Do List</h1>
          <div class="mt-8">
            <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
              <p id="progress-summary" class="text-sm font-medium text-indigo-50" aria-live="polite">총 0개 중 0개 완료 (0%)</p>
              <span id="progress-percentage" class="text-2xl font-bold" aria-hidden="true">0%</span>
            </div>
            <div
              id="progress-track"
              class="h-3 overflow-hidden rounded-full bg-white/25"
              role="progressbar"
              aria-label="할 일 달성률"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div id="progress-bar" class="h-full rounded-full bg-white transition-[width] duration-300 ease-out" style="width: 0%"></div>
            </div>
          </div>
        </header>

        <div class="px-5 py-6 sm:px-10 sm:py-8">
          <form id="todo-form" class="space-y-3">
            <div class="flex flex-col gap-3 sm:flex-row">
              <label class="sr-only" for="todo-input">새로운 할 일</label>
              <input
                id="todo-input"
                class="min-h-11 min-w-0 flex-1 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-base outline-none transition placeholder:text-slate-400 focus:border-indigo-400 focus:bg-white focus:ring-4 focus:ring-indigo-100"
                type="text"
                maxlength="100"
                autocomplete="off"
                placeholder="새로운 할 일을 입력하세요"
                aria-describedby="input-error"
              >
              <button class="min-h-11 rounded-xl bg-indigo-600 px-6 py-3 font-semibold text-white transition hover:bg-indigo-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600" type="submit">
                추가
              </button>
            </div>
            <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4">
              <label class="space-y-1 text-xs font-semibold text-slate-500">
                마감일
                <input id="todo-due-date" class="min-h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-sm text-slate-700 outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100" type="date">
              </label>
              <label class="space-y-1 text-xs font-semibold text-slate-500">
                우선순위
                <select id="todo-priority" class="min-h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-sm text-slate-700 outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100">
                  <option value="normal">보통</option>
                  <option value="high">높음</option>
                  <option value="low">낮음</option>
                </select>
              </label>
              <label class="space-y-1 text-xs font-semibold text-slate-500">
                카테고리
                <input id="todo-category" class="min-h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-sm text-slate-700 outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100" type="text" maxlength="30" placeholder="예: 업무, 개인">
              </label>
              <label class="space-y-1 text-xs font-semibold text-slate-500">
                반복
                <select id="todo-recurrence" class="min-h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-sm text-slate-700 outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100">
                  <option value="none">반복 없음</option>
                  <option value="daily">매일</option>
                  <option value="weekly">매주</option>
                  <option value="monthly">매월</option>
                </select>
              </label>
            </div>
            <label class="flex min-h-11 w-fit cursor-pointer items-center gap-2 text-sm text-slate-600">
              <input id="todo-remind" class="h-4 w-4 accent-indigo-600" type="checkbox">
              마감일 알림 받기
            </label>
          </form>
          <p id="input-error" class="mt-2 min-h-5 text-sm font-medium text-rose-600" role="status" aria-live="polite"></p>
          <p id="storage-error" class="mt-2 hidden rounded-lg bg-rose-50 px-4 py-3 text-sm font-medium text-rose-700" role="alert"></p>
          <div class="mt-2 flex flex-col gap-2 sm:flex-row sm:items-center">
            <button id="reminder-toggle" class="min-h-11 rounded-xl border border-indigo-200 px-4 text-sm font-semibold text-indigo-700 transition hover:bg-indigo-50" type="button">알림 켜기</button>
            <p id="reminder-status" class="text-sm text-slate-500" role="status" aria-live="polite">알림은 앱이 열려 있을 때 마감일 오전 9시에 표시됩니다.</p>
          </div>

          <section class="mt-8 rounded-2xl border border-slate-200 bg-slate-50 p-4 sm:p-5" aria-label="마감일 캘린더">
            <div class="mb-4 flex items-center justify-between gap-2">
              <h2 id="calendar-month" class="text-lg font-bold text-slate-800"></h2>
              <div class="flex items-center gap-1">
                <button id="calendar-today" class="min-h-11 rounded-lg px-3 text-sm font-semibold text-indigo-700 hover:bg-indigo-100" type="button">오늘</button>
                <button id="calendar-prev" class="min-h-11 min-w-11 rounded-lg text-xl text-slate-600 hover:bg-white" type="button" aria-label="이전 달">‹</button>
                <button id="calendar-next" class="min-h-11 min-w-11 rounded-lg text-xl text-slate-600 hover:bg-white" type="button" aria-label="다음 달">›</button>
              </div>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-500" aria-hidden="true">
              <span class="py-2">일</span><span class="py-2">월</span><span class="py-2">화</span><span class="py-2">수</span><span class="py-2">목</span><span class="py-2">금</span><span class="py-2">토</span>
            </div>
            <div id="calendar-grid" class="grid grid-cols-7 gap-1" role="grid" aria-label="월간 캘린더"></div>
            <div class="mt-3 flex flex-wrap items-center justify-between gap-2">
              <p id="calendar-selection" class="min-h-5 text-sm text-slate-600" aria-live="polite"></p>
              <button id="clear-date-filter" class="min-h-11 rounded-lg px-3 text-sm font-semibold text-indigo-700 hover:bg-indigo-100" type="button">날짜 필터 해제</button>
            </div>
          </section>

          <section class="mt-7" aria-label="할 일 목록">
            <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
              <div class="flex rounded-xl bg-slate-100 p-1" role="group" aria-label="할 일 필터">
                <button class="filter-button min-h-11 flex-1 rounded-lg px-3 text-sm font-semibold text-slate-600 transition hover:text-indigo-700 sm:flex-none" type="button" data-filter="all" aria-pressed="true">전체</button>
                <button class="filter-button min-h-11 flex-1 rounded-lg px-3 text-sm font-semibold text-slate-600 transition hover:text-indigo-700 sm:flex-none" type="button" data-filter="active" aria-pressed="false">진행 중</button>
                <button class="filter-button min-h-11 flex-1 rounded-lg px-3 text-sm font-semibold text-slate-600 transition hover:text-indigo-700 sm:flex-none" type="button" data-filter="completed" aria-pressed="false">완료됨</button>
              </div>
              <button id="clear-completed" class="min-h-11 rounded-xl px-3 text-sm font-semibold text-slate-500 transition hover:bg-rose-50 hover:text-rose-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-rose-500" type="button">
                완료 항목 삭제
              </button>
            </div>
            <div class="mb-4 grid grid-cols-1 gap-3 sm:grid-cols-3">
              <label class="sr-only" for="todo-search">할 일 검색</label>
              <input id="todo-search" class="min-h-11 rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100" type="search" placeholder="할 일 검색">
              <label class="sr-only" for="category-filter">카테고리 필터</label>
              <select id="category-filter" class="min-h-11 rounded-xl border border-slate-200 bg-white px-3 text-sm outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100">
                <option value="">모든 카테고리</option>
              </select>
              <label class="sr-only" for="todo-sort">정렬 기준</label>
              <select id="todo-sort" class="min-h-11 rounded-xl border border-slate-200 bg-white px-3 text-sm outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100">
                <option value="due">마감일순</option>
                <option value="priority">우선순위순</option>
                <option value="completion">미완료 먼저</option>
              </select>
            </div>

            <ul id="todo-list" class="space-y-3" aria-live="polite"></ul>
            <div id="empty-state" class="rounded-2xl border border-dashed border-slate-200 bg-slate-50 px-5 py-10 text-center text-slate-500" role="status"></div>
          </section>
        </div>
      </section>
      <p class="mt-5 text-center text-xs text-slate-400">작은 할 일부터 하나씩 완료해 보세요.</p>
    </main>
  </body>
</html>
