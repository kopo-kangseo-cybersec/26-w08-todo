<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>오늘의 할 일</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body class="min-h-screen bg-[#f5f7fb] text-slate-800">
    <main class="mx-auto max-w-3xl px-4 py-8 sm:px-6 sm:py-12">
      <section class="mx-auto overflow-hidden rounded-3xl bg-white shadow-xl shadow-indigo-950/5" aria-labelledby="page-title">
        <div class="p-5 sm:p-8 md:p-10">
          <header class="mb-7">
            <p class="mb-2 text-xs font-bold uppercase tracking-[0.18em] text-indigo-600">MY DAILY PLAN</p>
            <h1 id="page-title" class="mb-2 text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">오늘의 할 일</h1>
            <p class="text-sm leading-6 text-slate-500 sm:text-base">작은 한 걸음씩, 오늘의 목표를 완성해 보세요.</p>
          </header>

          <form id="todo-form" class="mb-2 grid grid-cols-12 gap-2" novalidate>
            <div class="col-span-12 md:col-span-7">
              <label for="todo-input" class="sr-only">새 할 일</label>
              <input
                id="todo-input"
                class="h-12 w-full rounded-xl border border-slate-200 bg-white px-4 text-base outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100"
                type="text"
                maxlength="100"
                placeholder="예: 프로젝트 계획 세우기"
                autocomplete="off"
                aria-describedby="form-message">
            </div>
            <div class="col-span-7 md:col-span-3">
              <label for="todo-date" class="sr-only">마감일 (선택)</label>
              <input
                id="todo-date"
                class="h-12 w-full rounded-xl border border-slate-200 bg-white px-3 text-sm text-slate-600 outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100"
                type="date"
                aria-describedby="form-message">
            </div>
            <div class="col-span-5 md:col-span-2">
              <button class="h-12 w-full rounded-xl bg-indigo-600 px-3 font-semibold text-white shadow-sm transition hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-200" type="submit">추가</button>
            </div>
          </form>
          <p id="form-message" class="mb-5 min-h-5 text-sm text-rose-600" role="status" aria-live="polite"></p>

          <section class="mb-5 rounded-2xl bg-indigo-50 p-4 sm:p-5" aria-labelledby="progress-title">
            <div class="mb-2 flex items-center justify-between">
              <h2 id="progress-title" class="text-sm font-semibold text-slate-700">오늘의 진행률</h2>
              <span id="progress-label" class="text-sm font-bold text-indigo-700">0%</span>
            </div>
            <div
              id="progress-bar"
              class="h-2 overflow-hidden rounded-full bg-indigo-100"
              role="progressbar"
              aria-label="할 일 완료 진행률"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0">
              <div id="progress-fill" class="h-full w-0 rounded-full bg-indigo-600 transition-[width] duration-300"></div>
            </div>
            <p id="progress-count" class="mt-2 text-xs text-slate-500">0개 중 0개 완료</p>
          </section>
          <p id="completion-message" class="mb-3 min-h-6 text-center text-sm font-semibold text-indigo-700" aria-live="polite"></p>

          <nav class="mb-3 inline-flex max-w-full rounded-xl bg-slate-100 p-1" role="group" aria-label="할 일 필터">
            <button class="rounded-lg px-4 py-2 text-sm font-medium transition" type="button" data-filter="all" aria-pressed="true">전체</button>
            <button class="rounded-lg px-4 py-2 text-sm font-medium transition" type="button" data-filter="active" aria-pressed="false">미완료</button>
            <button class="rounded-lg px-4 py-2 text-sm font-medium transition" type="button" data-filter="completed" aria-pressed="false">완료</button>
          </nav>

          <ul id="todo-list" class="divide-y divide-slate-100" aria-label="할 일 목록"></ul>
          <p id="empty-message" class="rounded-2xl bg-slate-50 px-4 py-12 text-center text-sm text-slate-500" role="status">
            할 일을 추가하세요.
          </p>
        </div>
      </section>
    </main>

    <div id="delete-dialog" class="confirmation-overlay" hidden>
      <section
        class="confirmation-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="delete-dialog-title"
        aria-describedby="delete-dialog-description">
        <svg class="despair-icon" viewBox="0 0 120 120" role="img" aria-labelledby="despair-icon-title">
          <title id="despair-icon-title">슬픈 표정의 장식 아이콘</title>
          <circle cx="60" cy="60" r="54" fill="#f7edcf" stroke="#b38a45" stroke-width="3"/>
          <path d="M22 36 34 24l10 8 10-13 12 13 12-9 13 14" fill="none" stroke="#b38a45" stroke-width="3" stroke-linecap="round"/>
          <path d="M32 52c5-7 12-7 17 0m22 0c5-7 12-7 17 0" fill="none" stroke="#39333b" stroke-width="4" stroke-linecap="round"/>
          <path d="M45 82c8-13 22-13 30 0" fill="none" stroke="#39333b" stroke-width="4" stroke-linecap="round"/>
          <path d="M31 69c4 7 7 11 11 14m47-14c-4 7-7 11-11 14" fill="none" stroke="#b38a45" stroke-width="2" stroke-linecap="round"/>
          <path d="M19 88c-7 4-9 10-5 15 5 6 12 2 12-5m70-5c7 4 9 10 5 15-5 6-12 2-12-5" fill="#d5a95f" stroke="#b38a45" stroke-width="2"/>
          <circle cx="60" cy="105" r="3" fill="#b38a45"/>
        </svg>
        <p class="mb-2 text-sm font-semibold text-amber-800">한 번 더 생각해 볼까요?</p>
        <h2 id="delete-dialog-title" class="mb-2 text-xl font-bold text-slate-900">이 할 일을 삭제할까요?</h2>
        <p id="delete-dialog-description" class="mb-6 text-sm leading-6 text-slate-500">삭제하면 목록에서 사라집니다.</p>
        <div class="flex justify-center gap-2">
          <button id="cancel-delete" class="rounded-xl border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-slate-200" type="button">취소</button>
          <button id="confirm-delete" class="rounded-xl bg-rose-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-rose-700 focus:outline-none focus:ring-4 focus:ring-rose-200" type="button">삭제할게요</button>
        </div>
      </section>
    </div>
  </body>
</html>
