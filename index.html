<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="일상의 할 일을 빠르고 가볍게 관리하는 투두 리스트">
    <title>오늘의 할 일</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container app-container py-5">
      <section class="todo-app mx-auto" aria-labelledby="app-title">
        <header class="app-header mb-4">
          <p class="eyebrow mb-2">DAILY CHECKLIST</p>
          <h1 id="app-title" class="h2 mb-3">오늘의 할 일</h1>
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="text-secondary">진행률</span>
            <span id="progress-label" class="small fw-semibold" aria-live="polite">0개 중 0개 완료</span>
          </div>
          <div
            class="progress progress-track"
            role="progressbar"
            aria-label="전체 할 일 진행률"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div id="progress-bar" class="progress-bar"></div>
          </div>
        </header>

        <div id="app-alert" class="alert alert-warning d-none" role="alert"></div>

        <form id="todo-form" class="input-group todo-input mb-4">
          <label class="visually-hidden" for="todo-input">새 할 일</label>
          <input
            id="todo-input"
            class="form-control"
            type="text"
            placeholder="새로운 할 일을 입력하세요"
            autocomplete="off"
            aria-describedby="app-alert"
          >
          <button class="btn btn-primary px-4" type="submit">추가</button>
        </form>

        <nav class="filter-tabs mb-3" aria-label="할 일 필터">
          <div class="nav nav-pills" role="group" aria-label="표시할 할 일">
            <button class="nav-link active" type="button" data-filter="all" aria-pressed="true">전체</button>
            <button class="nav-link" type="button" data-filter="active" aria-pressed="false">미완료</button>
            <button class="nav-link" type="button" data-filter="completed" aria-pressed="false">완료</button>
          </div>
        </nav>

        <ul id="todo-list" class="list-group todo-list" aria-label="할 일 목록"></ul>
        <p id="empty-state" class="empty-state text-center mb-0" role="status"></p>

        <footer class="todo-footer d-flex justify-content-between align-items-center gap-3 mt-3 pt-3">
          <span id="remaining-count" class="small text-secondary" aria-live="polite">남은 할 일 0개</span>
          <button id="clear-completed" class="btn btn-sm btn-outline-secondary" type="button">
            완료 항목 모두 삭제
          </button>
        </footer>
      </section>
    </main>
  </body>
</html>
